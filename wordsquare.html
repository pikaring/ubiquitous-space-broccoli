<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordClock Settings</title>

<style>
body {
  font-family: sans-serif;
  background:#f0f0f0;
  padding:20px;
}

.container{
  max-width:400px;
  margin:0 auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

h1{
  text-align:center;
}

select{
  width:100%;
  padding:12px;
}

button{
  margin-top:20px;
  width:100%;
  padding:15px;
  background:#FF5500;
  color:white;
  border:none;
}
</style>

</head>
<body>

<div class="container">

<h1>WordClock Configuration</h1>

<label>Background Color</label>

<select id="bg_color">
<option value="0">Black</option>
<option value="16777215">White</option>
<option value="255">Blue</option>
<option value="16711680">Red</option>
<option value="65280">Green</option>
<option value="5570730">Purple</option>
</select>

<button id="save_button">SAVE</button>

</div>

<script>

document.getElementById('save_button').onclick = function() {

  var color = document.getElementById('bg_color').value;

  var configData = {
    "KEY_BG_COLOR": parseInt(color,10)
  };

  var return_to = getQueryParam('return_to','pebblejs://close#');

  var location = return_to + encodeURIComponent(JSON.stringify(configData));

  document.location = location;

};

function getQueryParam(variable, defaultValue) {

  var query = location.search.substring(1);
  var vars = query.split('&');

  for (var i = 0; i < vars.length; i++) {

    var pair = vars[i].split('=');

    if (pair[0] === variable)
      return decodeURIComponent(pair[1]);

  }

  return defaultValue;
}

</script>

</body>
</html>
