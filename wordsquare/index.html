<!DOCTYPE html><html><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>WordClock Config</title>    <style>        /* Pebble風のシンプルなデザイン */        body { font-family: sans-serif; background-color: #f0f0f0; padding: 20px; color: #333; }        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }        h1 { font-size: 1.2rem; text-align: center; margin-bottom: 20px; }        .group { margin-bottom: 20px; }        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }        select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; background-color: #fff; }        .footer { margin-top: 30px; }        button {             width: 100%; padding: 15px; background-color: #FF5500; color: white;             border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;         }        button:active { background-color: #AA3300; }    </style></head><body>
<div class="container">    <h1>Color Configuration</h1>
    <div class="group">        <label for="bg_color">Select Background Color:</label>        <select id="bg_color">            <option value="0">Black</option>            <option value="16777215">White</option>            <option value="255">Blue</option>            <option value="16711680">Red</option>            <option value="65280">Green</option>            <option value="5570730">Purple</option>        </select>    </div>
    <div class="footer">        <button id="save_button">SAVE</button>    </div></div>
<script>    // 1. ページ読み込み時に現在の設定を反映させる（オプション）    window.onload = function() {        // 必要であれば初期値を設定するロジックをここに追加    };
    // 2. 保存ボタンの処理    document.getElementById('save_button').onclick = function() {        var colorSelect = document.getElementById('bg_color');                // JS側が期待しているデータ構造 { "bg_color": "..." }        var configData = {            "bg_color": colorSelect.value        };
        // Pebbleアプリに戻るためのURLスキームを作成        // return_toパラメータがない場合はデフォルトの pebblejs://close# を使用        var return_to = getQueryParam('return_to', 'pebblejs://close#');        var location = return_to + encodeURIComponent(JSON.stringify(configData));                document.location = location;    };
    // URLパラメータを取得するヘルパー関数    function getQueryParam(variable, defaultValue) {        var query = location.search.substring(1);        var vars = query.split('&');        for (var i = 0; i < vars.length; i++) {            var pair = vars[i].split('=');            if (pair[0] === variable) return decodeURIComponent(pair[1]);        }        return defaultValue;    }</script>
</body></html>
