<!DOCTYPE html>
<html>
<head>
  <title>Pebblis AI Config</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
  <div data-role="page" id="main">
    <div data-role="header"><h1>AI Weight Config</h1></div>
    <div data-role="content">
      <div class="ui-field-contain">
        <label for="weight_lines">消去ライン数 (得点重視):</label>
        <input type="range" name="weight_lines" id="weight_lines" value="50" min="1" max="100">
      </div>
      <div class="ui-field-contain">
        <label for="weight_height">低さ重視 (積み上げ防止):</label>
        <input type="range" name="weight_height" id="weight_height" value="50" min="1" max="100">
      </div>
      <div class="ui-field-contain">
        <label for="weight_holes">デッドスペース回避:</label>
        <input type="range" name="weight_holes" id="weight_holes" value="50" min="1" max="100">
      </div>
      <div class="ui-field-contain">
        <label for="weight_bumpiness">平坦さ重視 (高低差):</label>
        <input type="range" name="weight_bumpiness" id="weight_bumpiness" value="50" min="1" max="100">
      </div>
      <button id="save_button" data-theme="b">Save and Apply</button>
    </div>
    <script>
      $('#save_button').on('click', function() {
        // HTML側の保存ボタン処理
var config = {
  "weight_lines": document.getElementById('weight_lines').value,
  "weight_height": document.getElementById('weight_height').value,
  "weight_holes": document.getElementById('weight_holes').value,
  "weight_bumpiness": document.getElementById('weight_bumpiness').value
};

// オブジェクトを一度文字列(JSON)にしてからエンコードしてURLに付与
var location = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(config));
window.location.href = location;
      });
    </script>
  </div>
</body>
</html>
