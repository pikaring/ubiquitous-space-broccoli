<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ライド天気予報</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --primary: #1565c0;
      --primary-light: #1976d2;
      --primary-bg: #e3f2fd;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-sub: #546e7a;
      --border: #dde3ea;
      --green: #2e7d32;
      --green-bg: #e8f5e9;
      --orange: #e65100;
      --orange-bg: #fff3e0;
      --red: #c62828;
      --red-bg: #ffebee;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #0d47a1, #1565c0);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    header span { font-size: 1.5rem; }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 60px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header h2 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      flex: 1;
    }
    .card-body { padding: 18px; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s;
      user-select: none;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--primary);
      background: var(--primary-bg);
    }
    .drop-zone .dz-icon { font-size: 44px; margin-bottom: 10px; }
    .drop-zone p { color: var(--text-sub); font-size: 0.92rem; }
    .drop-zone.loaded {
      border-color: #2e7d32;
      background: var(--green-bg);
      padding: 18px;
    }
    .drop-zone.loaded .dz-icon { font-size: 28px; margin: 0; }
    .drop-zone.loaded p { font-weight: 600; color: var(--green); font-size: 0.9rem; }

    /* Route stats */
    .stats-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .stat-box { display: flex; flex-direction: column; gap: 2px; }
    .stat-box .val {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
    }
    .stat-box .lbl { font-size: 0.75rem; color: var(--text-sub); }

    /* Settings grid */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }
    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fg label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); }
    .fg input {
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    .fg input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(21,101,192,0.12);
    }

    /* PC Table */
    .pc-table-wrap { overflow-x: auto; }
    table.pc-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .pc-tbl th {
      padding: 8px 10px;
      background: #f8f9fb;
      border-bottom: 2px solid var(--border);
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
      white-space: nowrap;
    }
    .pc-tbl td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .pc-tbl tr:last-child td { border-bottom: none; }
    .pc-tbl input[type="number"] {
      width: 78px; padding: 4px 8px;
      border: 1.5px solid var(--border); border-radius: 5px;
      font-size: 0.88rem;
    }
    .pc-tbl input[type="text"] {
      width: 140px; padding: 4px 8px;
      border: 1.5px solid var(--border); border-radius: 5px;
      font-size: 0.88rem;
    }
    .pc-tbl input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(21,101,192,0.1);
    }

    .badge {
      display: inline-block; padding: 2px 9px;
      border-radius: 20px; font-size: 0.72rem; font-weight: 700;
      white-space: nowrap;
    }
    .badge-start { background: var(--green-bg); color: var(--green); }
    .badge-goal  { background: var(--primary-bg); color: var(--primary); }
    .badge-pc    { background: var(--orange-bg); color: var(--orange); }

    .btn-icon {
      background: none; border: none; cursor: pointer;
      color: var(--red); font-size: 0.85rem; padding: 3px 6px;
      border-radius: 4px; transition: background 0.15s;
    }
    .btn-icon:hover { background: var(--red-bg); }

    .btn {
      padding: 9px 18px;
      border: none; border-radius: 7px;
      cursor: pointer; font-size: 0.88rem; font-weight: 600;
      transition: all 0.15s;
    }
    .btn-outline {
      background: #fff; color: var(--primary);
      border: 1.5px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary-bg); }
    .btn-primary {
      background: var(--primary); color: #fff;
      box-shadow: 0 2px 8px rgba(21,101,192,0.3);
    }
    .btn-primary:hover { background: #0d47a1; }
    .btn-primary:disabled {
      background: #b0bec5; box-shadow: none; cursor: not-allowed;
    }
    .btn-big {
      width: 100%; padding: 14px; font-size: 1rem;
      border-radius: var(--radius); letter-spacing: 0.5px;
    }

    /* Results */
    table.res-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .res-tbl th {
      padding: 9px 10px;
      background: #f1f3f6;
      border-bottom: 2px solid var(--border);
      text-align: center;
      font-size: 0.75rem; font-weight: 700; color: var(--text-sub);
      white-space: nowrap;
    }
    .res-tbl th:first-child { text-align: left; }
    .res-tbl td {
      padding: 10px; border-bottom: 1px solid var(--border);
      text-align: center; vertical-align: middle;
    }
    .res-tbl td:first-child { text-align: left; }
    .res-tbl tr:last-child td { border-bottom: none; }
    .res-tbl tr:hover { background: #f8f9fb; }

    .pc-name { font-weight: 600; font-size: 0.9rem; margin-top: 3px; }

    .weather-icon { font-size: 1.7rem; line-height: 1; }
    .weather-desc { font-size: 0.7rem; color: var(--text-sub); margin-top: 2px; }

    .temp-main { font-size: 1.05rem; font-weight: 700; }
    .temp-feel { font-size: 0.72rem; color: var(--text-sub); margin-top: 1px; }

    .wind-dir-text { font-size: 0.9rem; font-weight: 600; }
    .wind-speed { font-size: 0.78rem; color: var(--text-sub); margin-top: 1px; }

    .precip-prob { font-size: 0.9rem; font-weight: 600; }
    .precip-prob.hi  { color: #1565c0; }
    .precip-prob.mid { color: #f57c00; }
    .precip-prob.lo  { color: var(--text-sub); }
    .precip-mm { font-size: 0.72rem; color: var(--text-sub); margin-top: 1px; }

    .arr-time { font-weight: 700; font-size: 0.92rem; }
    .arr-stop { font-size: 0.72rem; color: var(--text-sub); margin-top: 2px; }

    .summary-row td {
      background: #f1f3f6; font-weight: 600; border-top: 2px solid var(--border);
    }

    /* Map */
    #map { height: 340px; border-radius: 0 0 var(--radius) var(--radius); }

    /* Loading */
    .loading {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 40px; color: var(--text-sub); font-size: 0.92rem;
    }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-bar {
      background: var(--red-bg); border: 1px solid #ef9a9a;
      border-radius: 8px; padding: 10px 14px;
      color: var(--red); font-size: 0.88rem; display: none;
    }

    /* Utils */
    .hidden { display: none !important; }
    .mt12 { margin-top: 12px; }
    .flex-gap8 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* Responsive */
    @media (max-width: 580px) {
      .res-tbl th, .res-tbl td { padding: 7px 6px; font-size: 0.78rem; }
      .weather-icon { font-size: 1.3rem; }
      .temp-main { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<header>
  <span>🚴</span>
  <h1>ライド天気予報</h1>
</header>

<div class="container">

  <!-- GPX Upload -->
  <div class="card">
    <div class="card-header"><h2>📍 GPXファイル</h2></div>
    <div class="card-body">
      <div class="drop-zone" id="dropZone">
        <div class="dz-icon">🗺️</div>
        <p>GPXファイルをドラッグ&ドロップ<br><small style="opacity:.7">またはクリックして選択</small></p>
      </div>
      <input type="file" id="fileInput" accept=".gpx" style="display:none">
    </div>
  </div>

  <!-- Route Info -->
  <div class="card hidden" id="routeCard">
    <div class="card-header"><h2>🏔️ ルート情報</h2></div>
    <div class="card-body">
      <div class="stats-row">
        <div class="stat-box"><div class="val" id="statDist">--</div><div class="lbl">総距離 (km)</div></div>
        <div class="stat-box"><div class="val" id="statEle">--</div><div class="lbl">獲得標高 (m)</div></div>
        <div class="stat-box"><div class="val" id="statWp">--</div><div class="lbl">ウェイポイント</div></div>
      </div>
    </div>
  </div>

  <!-- Ride Settings -->
  <div class="card">
    <div class="card-header"><h2>⚙️ ライド設定</h2></div>
    <div class="card-body">
      <div class="settings-grid">
        <div class="fg">
          <label>スタート日時</label>
          <input type="datetime-local" id="startTime">
        </div>
        <div class="fg">
          <label>平均時速 (km/h)</label>
          <input type="number" id="avgSpeed" value="20" min="5" max="80" step="0.5">
        </div>
      </div>
    </div>
  </div>

  <!-- PC List -->
  <div class="card hidden" id="pcCard">
    <div class="card-header">
      <h2>🚩 PC・チェックポイント</h2>
    </div>
    <div class="card-body">
      <div class="pc-table-wrap">
        <table class="pc-tbl">
          <thead>
            <tr>
              <th>種別</th>
              <th>名称</th>
              <th>距離 (km)</th>
              <th>停車時間 (分)</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pcTbody"></tbody>
        </table>
      </div>
      <div class="flex-gap8 mt12">
        <button class="btn btn-outline" id="addPcBtn">+ PC追加</button>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-bar" id="errorBar"></div>

  <!-- Fetch Button -->
  <button class="btn btn-primary btn-big hidden" id="fetchBtn" disabled>
    🌤️ 天気予報を取得する
  </button>

  <!-- Results -->
  <div class="card hidden" id="resultsCard">
    <div class="card-header"><h2>📊 天気予報結果</h2></div>
    <div id="resultsBody"></div>
  </div>

  <!-- Map -->
  <div class="card hidden" id="mapCard">
    <div class="card-header"><h2>🗺️ ルートマップ</h2></div>
    <div id="map"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

// ─── State ───────────────────────────────────────────────────────────────────
let trackPoints = [];   // {lat, lon, ele, cumDist}
let gpxWaypoints = [];  // {lat, lon, name}
let pcList = [];        // {type, name, dist, rest, lat, lon}
let leafletMap = null;
let routeLayer = null;

// ─── Helpers ─────────────────────────────────────────────────────────────────

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
    * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatLocalDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatTime(d) {
  return d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function minutesToHM(mins) {
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return h > 0 ? `${h}時間${m > 0 ? m + '分' : ''}` : `${m}分`;
}

// ─── GPX Parsing ─────────────────────────────────────────────────────────────

function parseGPX(xml) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('GPXファイルの解析に失敗しました。');

  // Track points
  const trkNodes = doc.querySelectorAll('trkpt');
  if (trkNodes.length === 0) throw new Error('トラックデータが見つかりません。');

  let pts = Array.from(trkNodes).map(n => ({
    lat: parseFloat(n.getAttribute('lat')),
    lon: parseFloat(n.getAttribute('lon')),
    ele: parseFloat(n.querySelector('ele')?.textContent || 0),
    cumDist: 0
  }));

  let cum = 0;
  for (let i = 1; i < pts.length; i++) {
    cum += haversine(pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon);
    pts[i].cumDist = cum;
  }

  // Elevation gain
  let eleGain = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = pts[i].ele - pts[i - 1].ele;
    if (d > 0) eleGain += d;
  }

  // Waypoints
  const wpts = Array.from(doc.querySelectorAll('wpt')).map(n => ({
    lat: parseFloat(n.getAttribute('lat')),
    lon: parseFloat(n.getAttribute('lon')),
    name: n.querySelector('name')?.textContent?.trim() || 'ウェイポイント'
  }));

  return { pts, wpts, eleGain };
}

// Find track point with cumDist closest to target km
function ptAtDist(km) {
  let best = trackPoints[0];
  let bestDiff = Infinity;
  for (const p of trackPoints) {
    const d = Math.abs(p.cumDist - km);
    if (d < bestDiff) { bestDiff = d; best = p; }
  }
  return best;
}

// Find nearest track point to lat/lon
function nearestPt(lat, lon) {
  let best = trackPoints[0];
  let bestD = Infinity;
  for (const p of trackPoints) {
    const d = haversine(lat, lon, p.lat, p.lon);
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

// ─── PC Management ───────────────────────────────────────────────────────────

function initPCList() {
  const totalDist = trackPoints[trackPoints.length - 1].cumDist;
  const first = trackPoints[0];
  const last = trackPoints[trackPoints.length - 1];

  pcList = [
    { type: 'start', name: 'スタート', dist: 0, rest: 0, lat: first.lat, lon: first.lon }
  ];

  for (const wpt of gpxWaypoints) {
    const np = nearestPt(wpt.lat, wpt.lon);
    pcList.push({
      type: 'pc',
      name: wpt.name,
      dist: Math.round(np.cumDist * 10) / 10,
      rest: 15,
      lat: np.lat, lon: np.lon
    });
  }

  pcList.sort((a, b) => a.dist - b.dist);

  pcList.push({
    type: 'goal', name: 'ゴール',
    dist: Math.round(totalDist * 10) / 10,
    rest: 0, lat: last.lat, lon: last.lon
  });

  renderPCTable();
}

function pcBadge(pc, i) {
  if (pc.type === 'start') return `<span class="badge badge-start">スタート</span>`;
  if (pc.type === 'goal')  return `<span class="badge badge-goal">ゴール</span>`;
  const num = pcList.slice(1, i).filter(p => p.type === 'pc').length + 1;
  return `<span class="badge badge-pc">PC${num}</span>`;
}

function renderPCTable() {
  const tbody = document.getElementById('pcTbody');
  tbody.innerHTML = '';

  pcList.forEach((pc, i) => {
    const tr = document.createElement('tr');
    const isFixed = pc.type === 'start' || pc.type === 'goal';
    const restCell = pc.type === 'goal'
      ? '<td>—</td>'
      : `<td><input type="number" value="${pc.rest}" min="0" step="5"
            data-i="${i}" data-f="rest" style="width:68px"></td>`;
    const delCell = isFixed ? '<td></td>'
      : `<td><button class="btn-icon" onclick="removePc(${i})">✕</button></td>`;

    tr.innerHTML = `
      <td>${pcBadge(pc, i)}</td>
      <td><input type="text" value="${pc.name}" data-i="${i}" data-f="name" ${isFixed ? 'style="background:#f5f7fa"' : ''}></td>
      <td><input type="number" value="${pc.dist}" min="0" step="0.1" data-i="${i}" data-f="dist" ${isFixed ? 'readonly style="background:#f5f7fa"' : ''}></td>
      ${restCell}
      ${delCell}
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.i);
      const field = e.target.dataset.f;
      if (field === 'name') {
        pcList[idx].name = e.target.value;
      } else {
        const v = parseFloat(e.target.value) || 0;
        pcList[idx][field] = v;
        if (field === 'dist') {
          const p = ptAtDist(v);
          pcList[idx].lat = p.lat;
          pcList[idx].lon = p.lon;
        }
      }
    });
  });
}

function removePc(i) {
  pcList.splice(i, 1);
  renderPCTable();
}

document.getElementById('addPcBtn').addEventListener('click', () => {
  const total = trackPoints[trackPoints.length - 1]?.cumDist || 100;
  const goalIdx = pcList.findIndex(p => p.type === 'goal');
  const mid = total / 2;
  const mp = ptAtDist(mid);
  const newPc = {
    type: 'pc', name: `PC`, dist: Math.round(mid * 10) / 10,
    rest: 15, lat: mp.lat, lon: mp.lon
  };
  if (goalIdx >= 0) pcList.splice(goalIdx, 0, newPc);
  else pcList.push(newPc);
  renderPCTable();
});

// ─── File Upload ─────────────────────────────────────────────────────────────

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const { pts, wpts, eleGain } = parseGPX(e.target.result);
      trackPoints = pts;
      gpxWaypoints = wpts;

      const totalDist = pts[pts.length - 1].cumDist;

      dropZone.classList.add('loaded');
      dropZone.innerHTML = `<div class="dz-icon">✅</div><p>${file.name}<br><small style="font-weight:400;opacity:.8">${totalDist.toFixed(1)} km</small></p>`;

      document.getElementById('statDist').textContent = totalDist.toFixed(1);
      document.getElementById('statEle').textContent = Math.round(eleGain);
      document.getElementById('statWp').textContent = wpts.length;

      show('routeCard');
      show('pcCard');
      document.getElementById('fetchBtn').classList.remove('hidden');
      document.getElementById('fetchBtn').disabled = false;

      initPCList();
      initMap(pts, []);
      showError('');
    } catch (err) {
      showError(err.message);
    }
  };
  reader.readAsText(file);
}

// ─── Weather API ─────────────────────────────────────────────────────────────

// WMO weather code → [emoji, description]
const WMO = {
  0:  ['☀️',  '快晴'],
  1:  ['🌤️', '晴れ'],
  2:  ['⛅',  '晴れ時々曇り'],
  3:  ['☁️',  '曇り'],
  45: ['🌫️', '霧'],
  48: ['🌫️', '霧氷'],
  51: ['🌦️', '霧雨(弱)'],
  53: ['🌦️', '霧雨'],
  55: ['🌧️', '霧雨(強)'],
  56: ['🌨️', '着氷性霧雨'],
  57: ['🌨️', '着氷性霧雨(強)'],
  61: ['🌧️', '雨(弱)'],
  63: ['🌧️', '雨'],
  65: ['🌧️', '雨(強)'],
  66: ['🌨️', '着氷性の雨'],
  67: ['🌨️', '着氷性の雨(強)'],
  71: ['🌨️', '雪(弱)'],
  73: ['❄️',  '雪'],
  75: ['❄️',  '雪(強)'],
  77: ['❄️',  '霧雪'],
  80: ['🌦️', 'にわか雨(弱)'],
  81: ['🌧️', 'にわか雨'],
  82: ['⛈️',  'にわか雨(激)'],
  85: ['🌨️', 'にわか雪(弱)'],
  86: ['❄️',  'にわか雪(強)'],
  95: ['⛈️',  '雷雨'],
  96: ['⛈️',  '雷雨+雹'],
  99: ['⛈️',  '雷雨+大雹']
};

function wmoInfo(code) {
  return WMO[code] ?? ['❓', `コード${code}`];
}

// Convert wind degrees to 16-point Japanese compass
function deg2dir(deg) {
  const d = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東',
             '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
  return d[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
}

// Wind speed label (Beaufort-like, km/h input)
function windLabel(kmh) {
  if (kmh < 5)  return '無風';
  if (kmh < 20) return '弱風';
  if (kmh < 40) return '並風';
  if (kmh < 60) return '強風';
  return '暴風';
}

async function fetchWeatherAt(lat, lon, datetime) {
  const dateStr = formatLocalDate(datetime);
  const now = new Date();
  const diffDays = (datetime - now) / 86400000;

  if (diffDays > 16) {
    return { outOfRange: true };
  }

  let url;
  if (diffDays < -7) {
    url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}`
      + `&start_date=${dateStr}&end_date=${dateStr}`
      + `&hourly=temperature_2m,apparent_temperature,precipitation,windspeed_10m,winddirection_10m,weathercode`
      + `&timezone=Asia%2FTokyo&wind_speed_unit=kmh`;
  } else {
    url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      + `&start_date=${dateStr}&end_date=${dateStr}`
      + `&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,windspeed_10m,winddirection_10m,weathercode`
      + `&timezone=Asia%2FTokyo&wind_speed_unit=kmh`;
  }

  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`天気API エラー ${resp.status}`);
  const data = await resp.json();

  const h = data.hourly;
  const idx = datetime.getHours();

  return {
    temp:         h.temperature_2m[idx],
    feel:         h.apparent_temperature[idx],
    precip:       h.precipitation[idx],
    precipProb:   h.precipitation_probability ? h.precipitation_probability[idx] : null,
    windspeed:    h.windspeed_10m[idx],
    winddir:      h.winddirection_10m[idx],
    weathercode:  h.weathercode[idx]
  };
}

// ─── Calculate & Render ───────────────────────────────────────────────────────

document.getElementById('fetchBtn').addEventListener('click', async () => {
  const startVal = document.getElementById('startTime').value;
  if (!startVal) { showError('スタート日時を入力してください。'); return; }

  const speed = parseFloat(document.getElementById('avgSpeed').value);
  if (!speed || speed <= 0) { showError('平均時速を入力してください。'); return; }

  showError('');
  const resultsCard = document.getElementById('resultsCard');
  resultsCard.classList.remove('hidden');
  document.getElementById('resultsBody').innerHTML =
    '<div class="loading"><div class="spinner"></div>天気データを取得中…</div>';

  const startTime = new Date(startVal);
  let clock = new Date(startTime);
  let prevDist = 0;

  const results = pcList.map(pc => {
    const rideMin = (pc.dist - prevDist) / speed * 60;
    clock = new Date(clock.getTime() + rideMin * 60000);
    const arrival = new Date(clock);
    if (pc.rest > 0) clock = new Date(clock.getTime() + pc.rest * 60000);
    prevDist = pc.dist;
    return { ...pc, arrival, weather: null, err: null };
  });

  // Fetch all concurrently
  await Promise.all(results.map(async r => {
    try {
      r.weather = await fetchWeatherAt(r.lat, r.lon, r.arrival);
    } catch (e) {
      r.err = e.message;
    }
  }));

  renderResults(results, startTime, speed);
  updateMapMarkers(results);
});

function renderResults(results, startTime, speed) {
  const finalResult = results[results.length - 1];
  const totalMin = (finalResult.arrival - startTime) / 60000;
  const rideMin = results.reduce((s, r) => s + (r.rest || 0), 0);

  const rows = results.map((r, i) => {
    const badge = r.type === 'start' ? '<span class="badge badge-start">スタート</span>'
      : r.type === 'goal' ? '<span class="badge badge-goal">ゴール</span>'
      : `<span class="badge badge-pc">PC${results.slice(0, i).filter(x => x.type === 'pc').length + 1}</span>`;

    const arrStr = formatTime(r.arrival);
    const stopStr = r.rest > 0 ? `停車 ${r.rest}分` : '';

    if (r.err) {
      return `<tr>
        <td>${badge}<div class="pc-name">${r.name}</div></td>
        <td>${r.dist.toFixed(1)}</td>
        <td><div class="arr-time">${arrStr}</div><div class="arr-stop">${stopStr}</div></td>
        <td colspan="4" style="color:var(--red);font-size:0.8rem;">${r.err}</td>
      </tr>`;
    }

    const w = r.weather;
    if (!w || w.outOfRange) {
      const msg = w?.outOfRange ? '予報範囲外（16日以降）' : 'データなし';
      return `<tr>
        <td>${badge}<div class="pc-name">${r.name}</div></td>
        <td>${r.dist.toFixed(1)}</td>
        <td><div class="arr-time">${arrStr}</div><div class="arr-stop">${stopStr}</div></td>
        <td colspan="4" style="color:var(--text-sub);font-size:0.8rem;">${msg}</td>
      </tr>`;
    }

    const [icon, desc] = wmoInfo(w.weathercode);
    const dir = deg2dir(w.winddir);
    const probClass = w.precipProb > 60 ? 'hi' : w.precipProb > 30 ? 'mid' : 'lo';
    const probStr = w.precipProb !== null
      ? `<div class="precip-prob ${probClass}">${w.precipProb}%</div><div class="precip-mm">${w.precip.toFixed(1)} mm</div>`
      : `<div class="precip-mm">${w.precip.toFixed(1)} mm</div>`;

    return `<tr>
      <td>${badge}<div class="pc-name">${r.name}</div></td>
      <td style="font-weight:700">${r.dist.toFixed(1)}</td>
      <td><div class="arr-time">${arrStr}</div><div class="arr-stop">${stopStr}</div></td>
      <td>
        <div class="weather-icon">${icon}</div>
        <div class="weather-desc">${desc}</div>
      </td>
      <td>
        <div class="temp-main">${w.temp}°C</div>
        <div class="temp-feel">体感 ${w.feel}°C</div>
      </td>
      <td>
        <div class="wind-dir-text">${dir}</div>
        <div class="wind-speed">${w.windspeed.toFixed(0)} km/h</div>
        <div class="wind-speed" style="font-size:.68rem;opacity:.7">${windLabel(w.windspeed)}</div>
      </td>
      <td>${probStr}</td>
    </tr>`;
  }).join('');

  const summaryRideH = minutesToHM(totalMin - rideMin);
  const summaryTotalH = minutesToHM(totalMin);

  document.getElementById('resultsBody').innerHTML = `
    <div style="overflow-x:auto">
      <table class="res-tbl">
        <thead>
          <tr>
            <th>チェックポイント</th>
            <th>距離(km)</th>
            <th>到着予定</th>
            <th>天気</th>
            <th>気温</th>
            <th>風向き</th>
            <th>降水</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="padding:12px 18px;font-size:0.82rem;color:var(--text-sub);border-top:1px solid var(--border)">
      走行時間 <strong>${summaryRideH}</strong>（停車含む合計 <strong>${summaryTotalH}</strong>）
      ／ 平均時速 <strong>${speed} km/h</strong>
    </div>
  `;
}

// ─── Map ──────────────────────────────────────────────────────────────────────

function initMap(pts, markers) {
  show('mapCard');
  if (leafletMap) {
    leafletMap.remove();
    leafletMap = null;
  }
  leafletMap = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(leafletMap);

  const latlngs = pts.map(p => [p.lat, p.lon]);
  routeLayer = L.polyline(latlngs, { color: '#1565c0', weight: 3, opacity: 0.8 }).addTo(leafletMap);
  leafletMap.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
}

function updateMapMarkers(results) {
  if (!leafletMap) return;

  // Remove existing markers
  leafletMap.eachLayer(layer => {
    if (layer instanceof L.Marker) leafletMap.removeLayer(layer);
  });

  results.forEach((r, i) => {
    const color = r.type === 'start' ? '#2e7d32' : r.type === 'goal' ? '#1565c0' : '#e65100';
    const label = r.type === 'start' ? 'S' : r.type === 'goal' ? 'G'
      : `${results.slice(0, i).filter(x => x.type === 'pc').length + 1}`;

    const icon = L.divIcon({
      html: `<div style="width:26px;height:26px;background:${color};color:#fff;border-radius:50%;
             display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
             border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4)">${label}</div>`,
      iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -14], className: ''
    });

    let popupContent = `<strong>${r.name}</strong><br>${r.dist.toFixed(1)} km<br>${formatTime(r.arrival)}`;
    if (r.weather && !r.weather.outOfRange) {
      const [ic] = wmoInfo(r.weather.weathercode);
      popupContent += `<br>${ic} ${r.weather.temp}°C / 風: ${deg2dir(r.weather.winddir)} ${r.weather.windspeed.toFixed(0)} km/h`;
    }

    L.marker([r.lat, r.lon], { icon })
      .addTo(leafletMap)
      .bindPopup(popupContent);
  });
}

// ─── UI Utils ─────────────────────────────────────────────────────────────────

function show(id) { document.getElementById(id).classList.remove('hidden'); }

function showError(msg) {
  const el = document.getElementById('errorBar');
  if (msg) { el.textContent = msg; el.style.display = 'block'; }
  else el.style.display = 'none';
}

// Default start time: next Sunday 6:00
(function setDefaultTime() {
  const d = new Date();
  const daysUntilSun = (7 - d.getDay()) % 7 || 7;
  d.setDate(d.getDate() + daysUntilSun);
  d.setHours(6, 0, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('startTime').value =
    `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T06:00`;
})();
</script>
