<!DOCTYPE html>
<html>
  <head>
    <title>WordClock Config</title>
    <link rel='stylesheet' type='text/css' href='https://cdn.jsdelivr.net/npm/clay-beautify@1.0.0/dist/clay.min.css'>
  </head>
  <body>
    <div class='item-container'>
      <div class='item-container-header'>Color Settings</div>
      <div class='item-container-content'>
        <label class='item'>
          Background Color
          <select id='bg_color' class='item-select'>
            <option value='0' selected>Black</option>
            <option value='16777215'>White</option> <option value='255'>Blue</option>        <option value='16711680'>Red</option>    <option value='65280'>Green</option>     <option value='5570730'>Purple</option>  </select>
        </label>
      </div>
    </div>
    <div class='item-container'>
      <div class='button-container'>
        <input id='save_button' type='button' class='item-button' value='SAVE'>
      </div>
    </div>

<script>
  var saveButton = document.getElementById('save_button');
  saveButton.addEventListener('click', function() {
    var bgColor = document.getElementById('bg_color').value;
    
    // キー名を文字列ではなく、appinfo.jsonで定義した数値「10」に直接書き換えます
    var config = {
      "10": parseInt(bgColor, 10) 
    };

    console.log('Sending config: ' + JSON.stringify(config));

    // Pebbleアプリを閉じてデータを渡す
    // 文字列として明示的に pebblejs://close# を指定
    var url = "pebblejs://close#" + encodeURIComponent(JSON.stringify(config));
    document.location.href = url;
  });
</script>
  </body>
</html>
