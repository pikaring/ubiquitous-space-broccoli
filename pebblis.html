<!DOCTYPE html>
<html>
<head>
  <title>Visual Bar Timer Config</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>
  <div data-role="page" id="main">
    <div data-role="header"><h1>タイマー設定</h1></div>
    <div data-role="content">
      
      <div class="ui-field-contain">
        <label for="timer_mode">動作モード:</label>
        <select name="timer_mode" id="timer_mode">
          <option value="0">タイマーを使わない（秒を表示）</option>
          <option value="1">残り時間を設定する</option>
        </select>
      </div>

      <div id="countdown_settings" style="display:none;">
        <div class="ui-field-contain">
          <label for="h">時間 (最大24時間):</label>
          <input type="number" name="h" id="h" value="0" min="0" max="24">
        </div>
        <div class="ui-field-contain">
          <label for="m">分:</label>
          <input type="number" name="m" id="m" value="3" min="0" max="59">
        </div>
        <div class="ui-field-contain">
          <label for="s">秒:</label>
          <input type="number" name="s" id="s" value="0" min="0" max="59">
        </div>
      </div>

      <button id="save_button" data-theme="b">Save and Apply</button>
    </div>

<script>
  // ドキュメント読み込み完了後の処理
  $(document).on('pagecreate', '#main', function() {
    
    // ドロップダウンの変更を検知して入力欄の表示/非表示を切り替え
    $('#timer_mode').on('change', function() {
      if ($(this).val() == "1") {
        $('#countdown_settings').show();
      } else {
        $('#countdown_settings').hide();
      }
    });

    // 保存ボタンクリック時の処理
    $('#save_button').on('click', function() {
      var mode = parseInt($('#timer_mode').val(), 10) || 0;
      var h = parseInt($('#h').val(), 10) || 0;
      var m = parseInt($('#m').val(), 10) || 0;
      var s = parseInt($('#s').val(), 10) || 0;

      var config = {
        "timer_mode": mode,
        "total_seconds": (h * 3600) + (m * 60) + s
      };

      // pebblejs://close# を頭につけてアプリ側にデータを返す
      var return_url = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(config));
      window.location.href = return_url;
    });

  });
</script>
  </div>
</body>
</html>
