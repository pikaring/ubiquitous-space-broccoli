<!DOCTYPE html>
<html>
  <head>
    <title>WordClock Config</title>
    <link rel='stylesheet' type='text/css' href='https://cdn.jsdelivr.net/npm/clay-beautify@1.0.0/dist/clay.min.css'>
  </head>
  <body>
    <div class='item-container'>
      <div class='item-container-header'>Color Settings</div>
      <div class='item-container-content'>
        <label class='item'>
          Background Color
          <select id='bg_color' class='item-select'>
<option value='000000' selected>Black</option>
<option value='FFFFFF'>White</option>
<option value='0000FF'>Blue</option>
<option value='FF0000'>Red</option>
<option value='00FF00'>Green</option>
<option value='5500AA'>Purple</option>
          </select>
        </label>
      </div>
    </div>
    <div class='item-container'>
      <div class='button-container'>
        <input id='save_button' type='button' class='item-button' value='SAVE'>
      </div>
    </div>
    <script>
      var saveButton = document.getElementById('save_button');
      saveButton.addEventListener('click', function() {
        var config = { 'KEY_BG_COLOR': parseInt(document.getElementById('bg_color').value, 16) };
        document.location = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(config));
      });
    </script>
  </body>
</html>
