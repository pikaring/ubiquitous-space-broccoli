# AvatarTalk.xcodeproj は手書きで用意してあるので、ふつうはこのファイルを使う必要はない。
# Xcode のバージョン差でプロジェクトが開けなかったときの作り直し用。
#
#   brew install xcodegen
#   cd avatartalk/ios && xcodegen generate
#
name: AvatarTalk
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
  createIntermediateGroups: true

targets:
  AvatarTalk:
    type: application
    platform: iOS
    sources:
      - path: AvatarTalk
    info:
      path: Support/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.avatartalk
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
